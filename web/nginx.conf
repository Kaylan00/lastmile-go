# A página fala sempre com /api. Aqui o nginx repassa cada rota para o serviço
# certo, e o navegador não precisa de CORS (tudo na mesma origem).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # rastreio -> tracking-service
    location ~ ^/api/orders/[^/]+/tracking$ {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://tracking:8081;
    }

    # criar pedido -> dispatch-service
    location = /api/orders {
        rewrite ^/api(/.*)$ $1 break;
        proxy_pass http://dispatch:8080;
    }

    location /api/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
