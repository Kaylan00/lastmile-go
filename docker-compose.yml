services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: lastmile # senha só de desenvolvimento local
      POSTGRES_DB: lastmile
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Emulador oficial do Pub/Sub (roda local, sem conta no GCP).
  pubsub:
    image: gcr.io/google.com/cloudsdktool/google-cloud-cli:emulators
    command: gcloud beta emulators pubsub start --host-port=0.0.0.0:8085 --project=lastmile-local
    ports:
      - "8085:8085"
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8085"]
      interval: 2s
      timeout: 3s
      retries: 30

  dispatch:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: dispatch
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://lastmile:lastmile@postgres:5432/dispatch?sslmode=disable
      GCP_PROJECT: lastmile-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_SETUP: "true"
      WORKERS: "4"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  tracking:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: tracking
    environment:
      PORT: "8081"
      DATABASE_URL: postgres://lastmile:lastmile@postgres:5432/tracking?sslmode=disable
      GCP_PROJECT: lastmile-local
      PUBSUB_EMULATOR_HOST: pubsub:8085
      PUBSUB_SETUP: "true"
      # opcional: com a chave, o LLM escreve a mensagem da tentativa falha
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # o simulador anda em linha reta a 60 km/h; o ETA usa os mesmos números
      # para a previsão bater com o que se vê no mapa
      ETA_SPEED_KMH: "60"
      ETA_ROUTE_FACTOR: "1.0"
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      pubsub:
        condition: service_healthy

  # Faz o papel do app dos motoristas: registra 6 motoristas e "dirige" as entregas.
  simulator:
    build:
      context: .
      dockerfile: deploy/Dockerfile
      args:
        SERVICE: simulator
    environment:
      DISPATCH_URL: http://dispatch:8080
      DRIVERS: "6"
      SPEED_KMH: ${SIM_SPEED_KMH:-60} # o teste do CI acelera para não esperar minutos
      TICK: 2s
    depends_on:
      - dispatch

  # Página de rastreio (React) servida pelo nginx, que repassa /api para os serviços.
  web:
    build: ./web
    ports:
      - "3000:80"
    depends_on:
      - dispatch
      - tracking

volumes:
  pgdata:
